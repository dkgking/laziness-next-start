<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <title>A Next.js app: a page rendered on the server, its form calling a Server Action</title>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(470 300) scale(320 240)">
      <stop stop-color="#c4f5c0" stop-opacity=".10"/>
      <stop offset="1" stop-color="#c4f5c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#e8ece8" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="#141614"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- the server: what renders the page and runs the action -->
  <rect x="40" y="36" width="200" height="288" rx="14" fill="#1d201d" stroke="#2f332f"/>
  <line x1="40" y1="72" x2="240" y2="72" stroke="#2f332f"/>
  <!-- an N tile -->
  <rect x="56" y="45" width="18" height="18" rx="5" fill="#c4f5c0"/>
  <path d="M61 59V49l8 10V49" stroke="#0b1a0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="51" width="44" height="6" rx="3" fill="#e8ece8"/>
  <circle cx="218" cy="54" r="3" fill="#c4f5c0"/>

  <!-- page.tsx: a Server Component -->
  <rect x="56" y="88" width="168" height="104" rx="10" fill="#181b18" stroke="#2f332f"/>
  <rect x="68" y="100" width="46" height="6" rx="3" fill="#4a504a"/>
  <rect x="68" y="118" width="30" height="6" rx="3" fill="#c4f5c0"/>
  <rect x="104" y="118" width="64" height="6" rx="3" fill="#e8ece8"/>
  <rect x="80" y="134" width="96" height="6" rx="3" fill="#5a615a"/>
  <rect x="80" y="150" width="40" height="6" rx="3" fill="#c4f5c0" fill-opacity=".55"/>
  <rect x="126" y="150" width="58" height="6" rx="3" fill="#e8ece8"/>
  <rect x="68" y="170" width="22" height="6" rx="3" fill="#5a615a"/>

  <!-- actions.ts: a Server Action -->
  <rect x="56" y="204" width="168" height="72" rx="10" fill="#181b18" stroke="#c4f5c0" stroke-opacity=".45"/>
  <rect x="68" y="216" width="56" height="12" rx="6" fill="#c4f5c0" fill-opacity=".16"/>
  <rect x="76" y="220" width="40" height="4" rx="2" fill="#c4f5c0"/>
  <rect x="68" y="238" width="34" height="6" rx="3" fill="#c4f5c0"/>
  <rect x="108" y="238" width="72" height="6" rx="3" fill="#e8ece8"/>
  <rect x="80" y="254" width="88" height="6" rx="3" fill="#5a615a"/>

  <!-- the data -->
  <rect x="56" y="288" width="168" height="22" rx="7" fill="#252925" stroke="#2f332f"/>
  <circle cx="70" cy="299" r="3" fill="#c4f5c0"/>
  <rect x="82" y="296.5" width="60" height="5" rx="2.5" fill="#4a504a"/>

  <!-- rendered HTML goes to the browser -->
  <path d="M224 140 C 250 140, 250 120, 276 120" stroke="#c4f5c0" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M271 115.5l6 4.5-6 4.5" stroke="#c4f5c0" stroke-opacity=".9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the form calls the action -->
  <path d="M276 240 C 250 240, 250 240, 228 240" stroke="#c4f5c0" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M233 235.5l-6 4.5 6 4.5" stroke="#c4f5c0" stroke-opacity=".9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the app in the browser -->
  <rect x="276" y="36" width="324" height="288" rx="14" fill="#1d201d" stroke="#2f332f"/>
  <line x1="276" y1="72" x2="600" y2="72" stroke="#2f332f"/>
  <circle cx="292" cy="54" r="3" fill="#3a3f3a"/>
  <circle cx="302" cy="54" r="3" fill="#3a3f3a"/>
  <circle cx="312" cy="54" r="3" fill="#3a3f3a"/>
  <rect x="330" y="46" width="200" height="16" rx="8" fill="#181b18" stroke="#2f332f"/>
  <rect x="340" y="51.5" width="62" height="5" rx="2.5" fill="#4a504a"/>
  <circle cx="578" cy="54" r="7" stroke="#5a615a" stroke-width="1.5"/>
  <path d="M571 54h14M578 47c-3 4-3 10 0 14M578 47c3 4 3 10 0 14" stroke="#5a615a" stroke-width="1.2"/>

  <rect x="296" y="90" width="132" height="14" rx="6" fill="#e8ece8"/>
  <rect x="296" y="112" width="84" height="7" rx="3.5" fill="#5a615a"/>

  <!-- the list, rendered on the server -->
  <rect x="296" y="132" width="284" height="84" rx="10" fill="#181b18" stroke="#2f332f"/>
  <line x1="296" y1="160" x2="580" y2="160" stroke="#2f332f"/>
  <line x1="296" y1="188" x2="580" y2="188" stroke="#2f332f"/>
  <rect x="308" y="139.5" width="13" height="13" rx="4" fill="#c4f5c0"/>
  <path d="M311.2 146l2.5 2.5 4.3-4.7" stroke="#0b1a0c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="332" y="143" width="104" height="6" rx="3" fill="#3a3f3a"/>
  <line x1="330" y1="146" x2="438" y2="146" stroke="#5a615a" stroke-width="1.2"/>
  <rect x="308.5" y="168" width="12" height="12" rx="4" stroke="#5a615a" stroke-width="1.2"/>
  <rect x="332" y="171" width="136" height="6" rx="3" fill="#e8ece8"/>
  <rect x="546" y="171" width="22" height="6" rx="3" fill="#4a504a"/>
  <rect x="308.5" y="196" width="12" height="12" rx="4" stroke="#5a615a" stroke-width="1.2"/>
  <rect x="332" y="199" width="92" height="6" rx="3" fill="#e8ece8"/>
  <rect x="546" y="199" width="22" height="6" rx="3" fill="#4a504a"/>

  <!-- the form: the one part that runs in the browser -->
  <rect x="288" y="226" width="300" height="84" rx="12" stroke="#c4f5c0" stroke-opacity=".45" stroke-dasharray="5 4"/>
  <rect x="300" y="218" width="58" height="16" rx="8" fill="#141614" stroke="#c4f5c0" stroke-opacity=".45"/>
  <rect x="310" y="224" width="38" height="4" rx="2" fill="#c4f5c0"/>
  <rect x="300" y="246" width="200" height="28" rx="8" fill="#181b18" stroke="#2f332f"/>
  <rect x="312" y="257" width="82" height="6" rx="3" fill="#4a504a"/>
  <rect x="508" y="246" width="68" height="28" rx="8" fill="#c4f5c0"/>
  <rect x="525" y="257" width="34" height="6" rx="3" fill="#0b1a0c"/>
  <rect x="300" y="286" width="120" height="6" rx="3" fill="#3a3f3a"/>
</svg>
